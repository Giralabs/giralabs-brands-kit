<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Serif:ital@1&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,500&display=block" rel="stylesheet">
<script src="common.js"></script>
<style id="base"></style>
<style>
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;margin-bottom:30px}
.title{position:absolute;left:64px;right:56px;top:128px;font-size:112px}
.sub{position:absolute;left:66px;right:80px;font-size:38px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.logo{position:absolute;left:66px;top:56px;height:50px}
.lotus{position:absolute;background-size:contain;background-repeat:no-repeat;background-position:center}
.bip{position:absolute}
.dots{position:absolute;left:66px;bottom:52px;display:flex;gap:12px}
.dots i{width:14px;height:14px;border-radius:50%;background:currentColor;opacity:.25}
.dots i.on{opacity:1}
.swipe{position:absolute;right:48px;bottom:44px;padding:18px 32px;border-radius:999px;font:800 32px 'Plus Jakarta Sans';letter-spacing:-.01em}
.cta{position:absolute;display:inline-block;padding:26px 44px;border-radius:999px;font:800 40px 'Plus Jakarta Sans';letter-spacing:-.015em}
</style></head><body><script>
document.getElementById('base').textContent = BASE_CSS;
const MINT='#C0EED3', MINT2='#A0E3BD', FOREST='#44544B', CARBON='#23282E', INK='#1B2420', PALE='#E7F6EC';
const SLATE='#8796A8', SLATE2='#A9B6C4', ICE='#E4E9EE', AMBER='#E8B657', NIGHT='#191D22';

const lotus = (img, x, y, size, o = 1, rot = 0) =>
  `<div class="lotus" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;opacity:${o};transform:rotate(${rot}deg);background-image:url(assets/${img}.webp)"></div>`;
const pos = (x, y, html, rot = 0, z = 1) => `<div class="abs" style="left:${x}px;top:${y}px;transform:rotate(${rot}deg);z-index:${z}">${html}</div>`;
const bip = (code, x, y, size) => `<img class="bip" src="assets/${code}.webp" style="left:${x}px;top:${y}px;width:${size}px" alt="">`;
const dots = (n, at) => `<div class="dots">${Array.from({ length: n }, (_, i) => `<i class="${i === at ? 'on' : ''}"></i>`).join('')}</div>`;

const SLIDES = [
// ----- Sueltos -----
{ id:'post-1-business-agenda', bg:ICE, ink:NIGHT, html:`
  <img class="logo" src="assets/biz-on-light.webp" alt="">
  ${lotus('lotus-biz-light', 520, 500, 980, .14, 14)}
  <div class="title">La agenda que se llena <em style="color:#5E7083">mientras tú trabajas</em></div>
  ${bip('MB-10', 110, 480, 880)}
`},
{ id:'post-2-bipsy-reserva', bg:PALE, ink:INK, html:`
  <img class="logo" src="assets/bipsy-carbon.webp" alt="">
  ${lotus('lotus-carbon', -300, 420, 960, .05, -12)}
  <div class="title">Reserva <em style="color:#2C7A58">sin llamar a nadie</em></div>
  ${bip('BIP-01', 90, 400, 920)}
`},
// ----- Carrusel: Bipsy Business -----
{ id:'carrusel-business-1', bg:NIGHT, ink:'#F5F7F6', html:`
  <img class="logo" src="assets/biz-on-dark.webp" alt="">
  ${lotus('lotus-biz-dark', 480, 520, 1000, .12, 12)}
  <div class="title" style="font-size:124px">Todo tu negocio, <em style="color:${SLATE2}">en una app</em></div>
  ${pos(120, 560, phone('business-agenda-hoy', 620), -6)}
  ${pos(46, 660, push(960), -2, 3)}
  <div class="swipe" style="z-index:4;background:${SLATE2};color:${NIGHT}">Desliza →</div>
`},
{ id:'carrusel-business-2', bg:SLATE, ink:NIGHT, html:`
  ${lotus('lotus-biz-light', 520, 460, 960, .16, 16)}
  <div class="title">Agenda y <em style="color:#fff">reservas</em></div>
  <div class="sub" style="top:364px">Tus clientes reservan a cualquier hora. Tú lo ves todo de un vistazo.</div>
  ${bip('MB-10', 110, 470, 860)}
  ${dots(5, 0)}
`},
{ id:'carrusel-business-3', bg:ICE, ink:NIGHT, html:`
  ${lotus('lotus-biz-light', -300, 480, 900, .14, -14)}
  <div class="title">Cada cliente, <em style="color:#5E7083">en su ficha</em></div>
  <div class="sub" style="top:364px">Sus citas, sus notas y la conversación, en el mismo sitio.</div>
  ${bip('MB-11', 110, 470, 860)}
  ${dots(5, 1)}
`},
{ id:'carrusel-business-4', bg:AMBER, ink:NIGHT, html:`
  ${lotus('lotus-biz-dark', 500, 460, 960, .1, 14)}
  <div class="title">El fichaje, <em>resuelto</em></div>
  <div class="sub" style="top:364px">Tu equipo ficha desde el móvil y tú ves el registro de cada jornada.</div>
  ${bip('MB-13', 110, 470, 860)}
  ${dots(5, 2)}
`},
{ id:'carrusel-business-5', bg:SLATE2, ink:NIGHT, html:`
  ${lotus('lotus-biz-light', -320, 460, 960, .18, -10)}
  <div class="title">Tu trabajo, <em style="color:#fff">a la vista</em></div>
  <div class="sub" style="top:364px">Sube tu portfolio y deja que hable por ti en la app de Bipsy.</div>
  ${bip('MB-14', 110, 470, 860)}
  ${dots(5, 3)}
`},
{ id:'carrusel-business-6', bg:NIGHT, ink:'#F5F7F6', html:`
  <img class="logo" src="assets/biz-on-dark.webp" alt="">
  ${lotus('lotus-biz-dark', 440, 400, 1040, .14, 16)}
  <div class="title" style="font-size:136px;top:170px">Pruébalo <em style="color:${SLATE2}">14 días gratis</em></div>
  <div class="sub" style="top:520px;color:#AEB8C2;right:430px">Sin permanencia. Y tu equipo, gratis.</div>
  ${bip('MB-05', 410, 450, 780)}
  ${dots(5, 4)}
`},
// ----- Carrusel: Bipsy -----
{ id:'carrusel-bipsy-1', bg:MINT, ink:INK, html:`
  <img class="logo" src="assets/bipsy-carbon.webp" alt="">
  ${lotus('lotus-carbon', 500, 480, 960, .07, 14)}
  <div class="title" style="font-size:124px">Tu próxima cita, <em style="color:#2C7A58">en cuatro toques</em></div>
  ${pos(210, 560, phone('pagina-principal-cliente', 660), -5)}
  <div class="swipe" style="z-index:4;background:${CARBON};color:${MINT}">Desliza →</div>
`},
{ id:'carrusel-bipsy-2', bg:CARBON, ink:'#F5F7F6', html:`
  ${lotus('lotus-mint', -320, 560, 900, .1, -14)}
  <div class="title"><em style="color:${MINT}">Encuentra</em> lo que buscas</div>
  <div class="sub" style="top:364px;color:#B5C3BE">Por zona, por servicio o en el mapa.</div>
  ${pos(240, 470, phone('cliente-mapa', 620), 4)}
  ${dots(4, 0)}
`},
{ id:'carrusel-bipsy-3', bg:FOREST, ink:'#F4FAF6', html:`
  ${lotus('lotus-mint', 520, 420, 900, .12, 16)}
  <div class="title">Elige <em style="color:${MINT}">día y hora</em></div>
  <div class="sub" style="top:256px;color:#D5E5DB">Solo ves lo que está libre, con quien tú prefieras.</div>
  ${pos(90, 400, phone('cliente-reserva-dia', 560), -5)}
  ${pos(490, 500, phone('cliente-reserva-hora', 560), 5, 2)}
  ${dots(4, 1)}
`},
{ id:'carrusel-bipsy-4', bg:MINT2, ink:INK, html:`
  ${lotus('lotus-carbon', -300, 500, 900, .07, -12)}
  <div class="title">¿Sin hueco? <em style="color:#1F5F44">Te avisamos</em></div>
  <div class="sub" style="top:364px;color:#22352C">Apúntate a la lista de espera y entérate si se libera una hora.</div>
  ${pos(220, 480, phone('cliente-horas-no-todas', 640), -3)}
  ${pos(34, 600, crop('cliente-horas-no-todas', 47, 374, 851, 166, 1.14, {radius:76}), 2, 3)}
  ${dots(4, 2)}
`},
{ id:'carrusel-bipsy-5', bg:PALE, ink:INK, html:`
  <img class="logo" src="assets/bipsy-carbon.webp" alt="">
  ${lotus('lotus-carbon', 400, 420, 1040, .05, 12)}
  <div class="title" style="font-size:136px;top:170px">Reserva <em style="color:#2C7A58">gratis</em></div>
  <div class="sub" style="top:370px;color:#47584F;right:420px">En tus sitios de siempre y en otros nuevos.</div>
  ${bip('BIP-02', 250, 500, 800)}
  ${dots(4, 3)}
`},
];

document.body.insertAdjacentHTML('beforeend', SLIDES.map((s) =>
  `<section class="slide" id="${s.id}" style="background:${s.bg};color:${s.ink}">${s.html}</section>`).join(''));
window.READY = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]);
window.IDS = SLIDES.map((s) => s.id);
</script></body></html>
