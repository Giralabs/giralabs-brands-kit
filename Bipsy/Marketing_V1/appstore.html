<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Serif:ital@1&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,500&display=block" rel="stylesheet">
<script src="common.js"></script>
<style id="base"></style>
<style>
.slide{position:relative;width:1320px;height:2868px;overflow:hidden;margin-bottom:40px}
.slide .title{position:absolute;left:92px;right:80px;top:210px;font-size:172px}
.sub{position:absolute;left:96px;font-size:50px;font-weight:600;line-height:1.28;letter-spacing:-.012em}
.logo{position:absolute;left:96px;top:96px;height:74px}
.lotus{position:absolute;background-size:contain;background-repeat:no-repeat;background-position:center}
.tag{position:absolute;display:inline-flex;align-items:center;gap:14px;padding:22px 38px;border-radius:999px;font:800 44px 'Plus Jakarta Sans';letter-spacing:-.015em;box-shadow:0 26px 60px rgba(0,0,0,.26)}
</style></head><body><script>
document.getElementById('base').textContent = BASE_CSS;

const MINT='#C0EED3', MINT2='#A0E3BD', FOREST='#44544B', CARBON='#23282E', INK='#1B2420', PALE='#E7F6EC';
const SLATE='#8796A8', SLATE2='#A9B6C4', ICE='#E4E9EE', AMBER='#E8B657', NIGHT='#191D22';

// One giant lotus that crosses from one slide to the next: when the shop shows them
// side by side, the shape carries on.
const lotus = (img, x, y, size, o = 1, rot = 0) =>
  `<div class="lotus" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;opacity:${o};transform:rotate(${rot}deg);background-image:url(assets/${img}.webp)"></div>`;

const pos = (x, y, html, rot = 0, z = 1) =>
  `<div class="abs" style="left:${x}px;top:${y}px;transform:rotate(${rot}deg);z-index:${z}">${html}</div>`;

const SLIDES = [
// ---------- BIPSY (clientes) ----------
{ id:'bipsy-1', bg:MINT, ink:INK, html:`
  <img class="logo" src="assets/bipsy-carbon.webp" alt="">
  ${lotus('lotus-carbon', 620, 1000, 1500, .07, 18)}
  <div class="title" style="top:236px;font-size:186px">Tu próxima cita, <em style="color:#2C7A58">en cuatro toques</em></div>
  ${pos(170, 1010, phone('pagina-principal-cliente', 900), -7)}
  ${pos(36, 1760, crop('pagina-principal-cliente', 24, 831, 631, 536, 1.02, {radius:62}), -3, 3)}
  ${pos(770, 930, `<div class="tag" style="position:static;background:${CARBON};color:${MINT}">Sin llamar</div>`, 7, 3)}
`},
{ id:'bipsy-2', bg:CARBON, ink:'#F5F7F6', html:`
  ${lotus('lotus-mint', -760, 1500, 1500, .1, -20)}
  <div class="title">Lo bueno está <em style="color:${MINT}">cerca de ti</em></div>
  <div class="sub" style="top:610px;right:120px;color:#B5C3BE">Busca por zona, por servicio o directamente en el mapa.</div>
  ${pos(215, 830, phone('cliente-mapa', 890), 4)}
  ${pos(40, 1340, crop('cliente-mapa', 62, 880, 215, 195, 1.75, {radius:60}), -6, 3)}
  ${pos(850, 1960, crop('cliente-mapa', 300, 1140, 300, 200, 1.35, {radius:56}), 5, 3)}

`},
{ id:'bipsy-3', bg:FOREST, ink:'#F4FAF6', html:`
  ${lotus('lotus-mint', 700, 40, 1100, .12, 24)}
  <div class="title">Reserva a la hora <em style="color:${MINT}">que te venga bien</em></div>
  ${pos(230, 1010, phone('cliente-reserva-hora', 820), -4)}
  ${pos(270, 810, crop('cliente-reserva-dia', 40, 790, 865, 190, .96, {radius:62}), 3, 3)}
  ${pos(225, 1770, `<div style="width:276px;height:126px;border-radius:63px;background:#2C3338;color:${MINT};display:grid;place-items:center;font:600 62px 'Plus Jakarta Sans';letter-spacing:.01em;box-shadow:0 30px 70px rgba(0,0,0,.42),0 0 0 5px rgba(192,238,211,.28)">11:00</div>`, -4, 3)}
`},
{ id:'bipsy-4', bg:PALE, ink:INK, html:`
  ${lotus('lotus-carbon', -520, 80, 1100, .05, -16)}
  <div class="title">Con quien <em style="color:#2C7A58">tú prefieras</em></div>
  <div class="sub" style="top:610px;right:120px;color:#47584F">Elige a tu profesional o deja que te asignen a quien tenga hueco.</div>
  ${pos(330, 880, phone('cliente-selecciona-profesional', 900), 4)}
  ${pos(42, 1530, crop('cliente-selecciona-profesional', 47, 587, 851, 150, 1.25, {radius:64}), -3, 3)}
`},
{ id:'bipsy-5', bg:MINT2, ink:INK, html:`
  ${lotus('lotus-carbon', 760, -180, 1200, .07, 14)}
  <div class="title">¿Sin hueco? <em style="color:#1F5F44">Te avisamos</em></div>
  <div class="sub" style="top:610px;right:110px;color:#22352C">Apúntate a la lista de espera y entérate si se libera una hora.</div>
  ${pos(160, 900, phone('cliente-horas-no-todas', 900), -4)}
  ${pos(58, 1060, crop('cliente-horas-no-todas', 47, 374, 851, 166, 1.42, {radius:92}), 3, 3)}
`},
{ id:'bipsy-6', bg:CARBON, ink:'#F5F7F6', html:`
  ${lotus('lotus-mint', -500, 1300, 1500, .1, 20)}
  <div class="title">Tus citas, <em style="color:${MINT}">siempre a mano</em></div>
  <div class="sub" style="top:610px;right:110px;color:#B5C3BE">Próximas, pasadas y lo que quieras cambiar, en un solo sitio.</div>
  ${pos(160, 880, phone('cliente-mis-citas', 900), 3)}
  ${pos(40, 1710, crop('cliente-mis-citas', 47, 536, 851, 252, 1.34, {radius:62}), -3, 3)}
`},
// ---------- BIPSY BUSINESS ----------
{ id:'business-1', bg:NIGHT, ink:'#F5F7F6', html:`
  <img class="logo" src="assets/biz-on-dark.webp" alt="">
  ${lotus('lotus-biz-dark', 560, 900, 1500, .12, 16)}
  <div class="title" style="top:236px;font-size:186px">Tu negocio, <em style="color:${SLATE2}">en el bolsillo</em></div>
  ${pos(190, 960, phone('business-agenda-hoy', 900), -6)}
  ${pos(44, 1060, push(1190), -2, 3)}
`},
{ id:'business-2', bg:SLATE, ink:NIGHT, html:`
  ${lotus('lotus-biz-light', -680, 1420, 1500, .16, -18)}
  <div class="title">Cada cita, <em style="color:#fff">de un vistazo</em></div>
  <div class="sub" style="top:610px;right:120px;color:#1E262E">Un color por estado: lo que falta por cobrar y lo que ya está hecho.</div>
  ${pos(240, 880, phone('business-agenda-deldia', 900), 4)}
  ${pos(214, 1601, crop('business-agenda-deldia', 50, 750, 847, 207, 1.12, {radius:68}), 4, 3)}
  ${pos(298, 1829, crop('business-agenda-deldia', 50, 990, 847, 207, 1.12, {radius:68}), 4, 3)}
`},
{ id:'business-3', bg:ICE, ink:NIGHT, html:`
  ${lotus('lotus-biz-light', 720, 40, 1100, .14, 20)}
  <div class="title">Tus clientes, <em style="color:#5E7083">a un mensaje</em></div>
  <div class="sub" style="top:610px;right:120px;color:#47525E">Chatea con cada cliente, con fotos y avisos de sus citas.</div>
  ${pos(120, 880, phone('business-chat', 900), -4)}
  ${pos(236, 1760, `<div class="crop" style="background:#C0EED2;border-radius:68px;padding:5px 5px 40px">${crop('business-chat', 172, 1310, 734, 226, 1.42, {radius:64, style:'box-shadow:none;border-bottom-left-radius:40px;border-bottom-right-radius:40px'})}</div>`, 3, 3)}
`},
{ id:'business-4', bg:AMBER, ink:NIGHT, html:`
  ${lotus('lotus-biz-dark', -560, 1400, 1400, .1, -14)}
  <div class="title">Reseñas <em>de clientes que han venido</em></div>
  ${pos(250, 1030, phone('business-resenas', 860), 4)}
  ${pos(36, 1320, crop('business-resenas', 49, 325, 847, 161, 1.3, {radius:84}), -3, 3)}
`},
{ id:'business-5', bg:NIGHT, ink:'#F5F7F6', html:`
  ${lotus('lotus-biz-dark', 620, -160, 1300, .1, 16)}
  <div class="title">Tu equipo, <em style="color:${SLATE2}">al día</em></div>
  <div class="sub" style="top:610px;right:120px;color:#AEB8C2">Quién trabaja, quién ha fichado y el registro de cada jornada.</div>
  ${pos(26, 930, phone('business-equipo', 660), -5)}
  ${pos(610, 1330, phone('business-registro-fichajes', 660), 4, 2)}
`},
{ id:'business-6', bg:SLATE2, ink:NIGHT, html:`
  ${lotus('lotus-biz-light', -640, 1200, 1500, .16, 12)}
  <div class="title">Tu escaparate, <em style="color:#fff">a tu manera</em></div>
  <div class="sub" style="top:610px;right:120px;color:#26303A">Tus servicios y tu portfolio, listos para quien te busca en Bipsy.</div>
  ${pos(610, 880, phone('business-portfolio', 660), 4)}
  ${pos(26, 1300, phone('business-servicios', 660), -5, 2)}
`},
];

document.body.insertAdjacentHTML('beforeend', SLIDES.map((s) =>
  `<section class="slide" id="${s.id}" style="background:${s.bg};color:${s.ink}">${s.html}</section>`).join(''));
window.READY = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]);
window.IDS = SLIDES.map((s) => s.id);
</script></body></html>
