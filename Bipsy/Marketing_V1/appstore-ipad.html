<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Serif:ital@1&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,500&display=block" rel="stylesheet">
<script src="common.js"></script>
<style id="base"></style>
<style>
/* iPad 13" (2064 x 2752). Same pieces as appstore.html, laid out for the wider page:
   text and the floating pieces on the left, the phone on the right. */
.slide{position:relative;width:2064px;height:2752px;overflow:hidden;margin-bottom:40px}
.col{position:absolute;left:140px;top:150px;width:900px;display:flex;flex-direction:column;align-items:flex-start;z-index:3}
.col .title{font-size:156px}
.logo{height:84px;margin-bottom:110px}
.sub{margin-top:56px;font-size:54px;font-weight:600;line-height:1.28;letter-spacing:-.012em;max-width:860px}
.extra{margin-top:var(--mt,90px);margin-left:var(--ml,0);transform:rotate(var(--r,0deg))}
.lotus{position:absolute;background-size:contain;background-repeat:no-repeat;background-position:center}
.tag{display:inline-flex;align-items:center;gap:14px;padding:24px 44px;border-radius:999px;font:800 50px 'Plus Jakarta Sans';letter-spacing:-.015em;box-shadow:0 26px 60px rgba(0,0,0,.26)}
</style></head><body><script>
document.getElementById('base').textContent = BASE_CSS;

const MINT='#C0EED3', MINT2='#A0E3BD', FOREST='#44544B', CARBON='#23282E', INK='#1B2420', PALE='#E7F6EC';
const SLATE='#8796A8', SLATE2='#A9B6C4', ICE='#E4E9EE', AMBER='#E8B657', NIGHT='#191D22';

const lotus = (img, x, y, size, o = 1, rot = 0) =>
  `<div class="lotus" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;opacity:${o};transform:rotate(${rot}deg);background-image:url(assets/${img}.webp)"></div>`;

const pos = (x, y, html, rot = 0, z = 1) =>
  `<div class="abs" style="left:${x}px;top:${y}px;transform:rotate(${rot}deg);z-index:${z}">${html}</div>`;

/** Something under the text: `mt` space above, `ml` push to the right, `r` tilt. */
const extra = (html, { mt = 90, ml = 0, r = 0 } = {}) =>
  `<div class="extra" style="--mt:${mt}px;--ml:${ml}px;--r:${r}deg">${html}</div>`;

/** The single phone of most slides, on the right and centred in height. */
const PHONE_W = 880;
const right = (name, rot) => pos(1000, 400, phone(name, PHONE_W), rot);

const slide = ({ logo, title, sub, subColor, extras = '' }) => `<div class="col">
  ${logo ? `<img class="logo" src="assets/${logo}.webp" alt="">` : ''}
  <div class="title">${title}</div>
  ${sub ? `<div class="sub" style="color:${subColor}">${sub}</div>` : ''}
  ${extras}</div>`;

const SLIDES = [
// ---------- BIPSY (clientes) ----------
{ id:'ipad-bipsy-1', bg:MINT, ink:INK, html:`
  ${lotus('lotus-carbon', -500, 1500, 1700, .07, 18)}
  ${slide({ logo:'bipsy-carbon', title:`Tu próxima cita, <em style="color:#2C7A58">en cuatro toques</em>`, extras:
    extra(`<div class="tag" style="background:${CARBON};color:${MINT}">Sin llamar</div>`, { mt:110, r:-4 }) +
    extra(crop('pagina-principal-cliente', 24, 831, 631, 536, 1.45, {radius:70}), { mt:150, ml:40, r:-3 }) })}
  ${right('pagina-principal-cliente', 5)}
`},
{ id:'ipad-bipsy-2', bg:CARBON, ink:'#F5F7F6', html:`
  ${lotus('lotus-mint', -700, 1700, 1600, .1, -20)}
  ${slide({ title:`Lo bueno está <em style="color:${MINT}">cerca de ti</em>`, sub:'Busca por zona, por servicio o directamente en el mapa.', subColor:'#B5C3BE', extras:
    extra(crop('cliente-mapa', 62, 880, 215, 195, 2.2, {radius:64}), { mt:130, ml:60, r:-6 }) +
    extra(crop('cliente-mapa', 300, 1140, 300, 200, 1.9, {radius:60}), { mt:-40, ml:380, r:5 }) })}
  ${right('cliente-mapa', 4)}
  ${pos(1250, 320, crop('cliente-mapa', 312, 553, 323, 82, 1.6, {radius:64}), 3, 3)}
`},
{ id:'ipad-bipsy-3', bg:FOREST, ink:'#F4FAF6', html:`
  ${lotus('lotus-mint', 1100, -200, 1300, .12, 24)}
  ${slide({ title:`Reserva a la hora <em style="color:${MINT}">que te venga bien</em>`, extras:
    extra(crop('cliente-reserva-dia', 40, 790, 865, 190, 1.12, {radius:66}), { mt:150, r:3 }) +
    extra(`<div style="width:330px;height:150px;border-radius:75px;background:#2C3338;color:${MINT};display:grid;place-items:center;font:600 74px 'Plus Jakarta Sans';letter-spacing:.01em;box-shadow:0 30px 70px rgba(0,0,0,.42),0 0 0 5px rgba(192,238,211,.28)">11:00</div>`, { mt:130, ml:120, r:-4 }) })}
  ${right('cliente-reserva-hora', -4)}
`},
{ id:'ipad-bipsy-4', bg:PALE, ink:INK, html:`
  ${lotus('lotus-carbon', -520, 1600, 1300, .05, -16)}
  ${slide({ title:`Con quien <em style="color:#2C7A58">tú prefieras</em>`, sub:'Elige a tu profesional o deja que te asignen a quien tenga hueco.', subColor:'#47584F', extras:
    extra(crop('cliente-selecciona-profesional', 47, 587, 851, 150, 1.32, {radius:68}), { mt:170, r:-3 }) })}
  ${right('cliente-selecciona-profesional', 4)}
`},
{ id:'ipad-bipsy-5', bg:MINT2, ink:INK, html:`
  ${lotus('lotus-carbon', 1200, -260, 1400, .07, 14)}
  ${slide({ title:`¿Sin hueco? <em style="color:#1F5F44">Te avisamos</em>`, sub:'Apúntate a la lista de espera y entérate si se libera una hora.', subColor:'#22352C', extras:
    extra(crop('cliente-horas-no-todas', 47, 374, 851, 166, 1.3, {radius:96}), { mt:170, r:3 }) })}
  ${right('cliente-horas-no-todas', -4)}
`},
{ id:'ipad-bipsy-6', bg:CARBON, ink:'#F5F7F6', html:`
  ${lotus('lotus-mint', -500, 1500, 1600, .1, 20)}
  ${slide({ title:`Tus citas, <em style="color:${MINT}">siempre a mano</em>`, sub:'Próximas, pasadas y lo que quieras cambiar, en un solo sitio.', subColor:'#B5C3BE', extras:
    extra(crop('cliente-mis-citas', 47, 536, 851, 252, 1.3, {radius:66}), { mt:170, r:-3 }) })}
  ${right('cliente-mis-citas', 3)}
`},
// ---------- BIPSY BUSINESS ----------
{ id:'ipad-business-1', bg:NIGHT, ink:'#F5F7F6', html:`
  ${lotus('lotus-biz-dark', -400, 1500, 1700, .12, 16)}
  ${slide({ logo:'biz-on-dark', title:`Tu negocio, <em style="color:${SLATE2}">en el bolsillo</em>`, extras:
    extra(push(1180), { mt:220, r:-2 }) })}
  ${right('business-agenda-hoy', 5)}
`},
{ id:'ipad-business-2', bg:SLATE, ink:NIGHT, html:`
  ${lotus('lotus-biz-light', -680, 1600, 1600, .16, -18)}
  ${slide({ title:`Cada cita, <em style="color:#fff">de un vistazo</em>`, sub:'Un color por estado: lo que falta por cobrar y lo que ya está hecho.', subColor:'#1E262E', extras:
    extra(crop('business-agenda-deldia', 50, 750, 847, 207, 1.22, {radius:74}), { mt:160, r:-3 }) +
    extra(crop('business-agenda-deldia', 50, 990, 847, 207, 1.22, {radius:74}), { mt:60, ml:90, r:-3 }) })}
  ${right('business-agenda-deldia', 4)}
`},
{ id:'ipad-business-3', bg:ICE, ink:NIGHT, html:`
  ${lotus('lotus-biz-light', 1200, -100, 1300, .14, 20)}
  ${slide({ title:`Tus clientes, <em style="color:#5E7083">a un mensaje</em>`, sub:'Chatea con cada cliente, con fotos y avisos de sus citas.', subColor:'#47525E', extras:
    extra(`<div class="crop" style="background:#C0EED2;border-radius:72px;padding:5px 5px 40px">${crop('business-chat', 172, 1310, 734, 226, 1.5, {radius:68, style:'box-shadow:none;border-bottom-left-radius:40px;border-bottom-right-radius:40px'})}</div>`, { mt:170, r:3 }) })}
  ${right('business-chat', -4)}
`},
{ id:'ipad-business-4', bg:AMBER, ink:NIGHT, html:`
  ${lotus('lotus-biz-dark', -560, 1500, 1600, .1, -14)}
  ${slide({ title:`Reseñas <em>de clientes que han venido</em>`, extras:
    extra(crop('business-resenas', 49, 325, 847, 161, 1.3, {radius:88}), { mt:190, r:-3 }) })}
  ${right('business-resenas', 4)}
`},
{ id:'ipad-business-5', bg:NIGHT, ink:'#F5F7F6', html:`
  ${lotus('lotus-biz-dark', -500, 1700, 1400, .1, 16)}
  ${slide({ title:`Tu equipo, <em style="color:${SLATE2}">al día</em>`, sub:'Quién trabaja, quién ha fichado y el registro de cada jornada.', subColor:'#AEB8C2' })}
  ${pos(700, 1130, phone('business-equipo', 640), -5)}
  ${pos(1290, 470, phone('business-registro-fichajes', 640), 4, 2)}
`},
{ id:'ipad-business-6', bg:SLATE2, ink:NIGHT, html:`
  ${lotus('lotus-biz-light', -640, 1500, 1600, .16, 12)}
  ${slide({ title:`Tu escaparate, <em style="color:#fff">a tu manera</em>`, sub:'Tus servicios y tu portfolio, listos para quien te busca en Bipsy.', subColor:'#26303A' })}
  ${pos(700, 1130, phone('business-servicios', 640), -5)}
  ${pos(1290, 470, phone('business-portfolio', 640), 4, 2)}
`},
];

document.body.insertAdjacentHTML('beforeend', SLIDES.map((s) =>
  `<section class="slide" id="${s.id}" style="background:${s.bg};color:${s.ink}">${s.html}</section>`).join(''));
window.READY = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]);
window.IDS = SLIDES.map((s) => s.id);
</script></body></html>
